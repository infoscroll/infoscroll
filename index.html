<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>InfoScroll</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1016;--paper:#f2f4f7;--dim:#b8c0cc}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:#05080c;color:var(--paper);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.app{position:relative;width:min(100%,520px);height:100dvh;margin:0 auto;background:var(--ink);overflow:hidden}
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.card{--c:#33415c;position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;align-items:flex-end;background:linear-gradient(160deg,var(--c),var(--ink) 80%)}
.music{--c:#5b3fc4}.artists{--c:#b8374f}.actors{--c:#c48f22}.places{--c:#1a8a80}.history{--c:#3f68b8}.news{--c:#4a5a72}.books{--c:#8a5a2b}.sports{--c:#1f8a4c}.more{--c:#3b4a66}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,8,12,.95) 10%,rgba(5,8,12,.55) 45%,rgba(5,8,12,.12) 70%,rgba(5,8,12,.55))}
.body{position:relative;z-index:2;width:100%;padding:0 80px calc(30px + env(safe-area-inset-bottom)) 20px}
.views{display:inline-block;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);margin-bottom:10px}
h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.05;letter-spacing:-.02em}
.desc{color:var(--dim);margin:6px 0 12px;font-size:.95rem}
.sum{font-size:1.02rem;line-height:1.5;max-width:44ch}
.src{display:inline-block;margin-top:12px;font-size:.82rem;color:var(--dim);text-underline-offset:3px}
.msg .btn{margin-top:16px;padding:10px 20px;border-radius:99px;background:#fff;color:var(--ink);font-weight:700}
.ld{display:grid;place-items:center;color:var(--dim)}
.ld::after{display:none}
.top{position:absolute;z-index:5;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 14px;background:linear-gradient(rgba(5,8,12,.8),transparent)}
.tabs{display:flex;justify-content:center;gap:24px}
.tab{padding:6px 2px;font-weight:700;color:var(--dim);border-bottom:2px solid transparent}
.tab[aria-selected=true]{color:#fff;border-color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.chips[hidden]{display:none}
.chip{flex:none;padding:5px 13px;border-radius:99px;border:1px solid rgba(255,255,255,.35);font-size:.85rem;background:rgba(5,8,12,.4)}
.chip[aria-pressed=true]{background:#fff;color:var(--ink);border-color:#fff}
.rail{position:absolute;z-index:5;right:12px;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
.rb{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);display:grid;place-items:center}
.rb svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lw{position:absolute;z-index:4;right:12px;bottom:calc(265px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:3px}.rc{text-align:center;line-height:1.1}.rc b{display:block;font-size:.95rem}.rc span{font-size:.7rem;color:var(--dim)}
.like[aria-pressed=true] svg{fill:#ff4d6d;stroke:#ff4d6d;animation:pop .28s}
@keyframes pop{50%{transform:scale(1.3)}}
#sname{font-size:.72rem;color:#fff;text-shadow:0 1px 4px #000;max-width:64px;text-align:center;line-height:1.1}
.sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;background:#141b24;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet h3{font-family:Fraunces,serif;font-size:1.2rem}
.snd{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.row{display:flex;gap:12px;align-items:center}
.row input{flex:1;accent-color:#fff}
.toast{position:absolute;z-index:9;top:calc(150px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);color:var(--ink);padding:6px 16px;border-radius:99px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.splash{position:absolute;z-index:20;inset:0;background:var(--ink);display:flex;flex-direction:column;justify-content:center;padding:32px;gap:14px;background:linear-gradient(160deg,#2a2166,var(--ink) 65%)}
.splash h1{font-family:Fraunces,serif;font-size:3.2rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.splash p{color:var(--dim);max-width:34ch}
.splash .go{padding:14px;border-radius:99px;background:#fff;color:var(--ink);font-weight:700;margin-top:10px}
.splash .skip{color:var(--dim);text-decoration:underline;text-underline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#mute[aria-pressed=true]{opacity:.55}#mute[aria-pressed=true]::after{content:"";position:absolute;width:30px;height:2px;background:#fff;transform:rotate(-45deg)}#mute{position:relative}
.np{display:block;margin-top:8px;text-align:center;font-size:.78rem;color:var(--dim);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.sw{position:relative;flex:1;min-width:0}
.menu{position:relative;flex:none}
.ib{width:44px;height:44px;border-radius:50%;padding:0;overflow:hidden;border:2px solid rgba(255,255,255,.7);display:block}
.ib img{width:100%;height:100%;display:block}
.mpop{position:absolute;right:0;top:calc(100% + 8px);z-index:7;min-width:210px;background:#141b24;border-radius:14px;padding:16px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.mpop p{font-size:.9rem;color:var(--dim);margin-bottom:12px}
.cbtn{display:block;padding:11px 18px;border-radius:99px;background:#fff;color:var(--ink);font-weight:700;text-decoration:none}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px)}
.search svg{width:20px;height:20px;fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;outline:none}
.search input::placeholder{color:var(--dim)}
.search:focus-within{box-shadow:0 0 0 2px #fff}
.qx{font-size:1.5rem;line-height:1;color:var(--dim)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#141b24;border-radius:14px;max-height:60dvh;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.sug button{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;text-align:left}
.sug button:hover,.sug button:focus-visible{background:rgba(255,255,255,.08)}
.sug img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#26303c;flex:none}
.sug b{display:block}.sug small{color:var(--dim)}
.sug .none{padding:14px;color:var(--dim)}
#auto{position:relative}
.rb .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);stroke-width:0}
.ring circle{fill:none;stroke-width:3}
.trk{stroke:rgba(255,255,255,.2)}
.prg{stroke:#fff;stroke-dasharray:119.4;stroke-dashoffset:119.4;stroke-linecap:round}
#ac{font-weight:700;font-size:1rem}
#auto[aria-pressed=true]{background:rgba(255,255,255,.26)}
.lbl{font-size:.75rem;color:var(--dim);margin-top:-6px;padding:2px 8px}
.pb{position:absolute;z-index:6;top:0;left:0;height:3px;width:0;background:#fff;pointer-events:none}
.tabs{gap:12px;overflow-x:auto;scrollbar-width:none;justify-content:safe center}.tab{font-size:.95rem;white-space:nowrap}
.card img.bgb{filter:blur(30px) brightness(.55);transform:scale(1.25)}
.card img.cv{inset:auto;top:calc(128px + env(safe-area-inset-top));left:50%;width:min(66vw,34dvh);height:auto;aspect-ratio:1;border-radius:14px;transform:translateX(-50%);box-shadow:0 18px 40px rgba(0,0,0,.55);z-index:1;cursor:pointer}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chs .views{margin:0}
.cbtn.g2{width:100%;margin-top:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:inherit}
.card img.cv.bk{aspect-ratio:2/3;width:min(44vw,20dvh);object-fit:cover}.books .sum{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:.95rem}
.books{background:#16110c}.books::after{display:none}
.books .pager{position:absolute;z-index:2;inset:calc(118px + env(safe-area-inset-top)) 0 0 0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.books .pager::-webkit-scrollbar{display:none}
.books .pager .pg{flex:none;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:8px 24px calc(96px + env(safe-area-inset-bottom));overflow-y:auto;font:1.02rem/1.6 Georgia,Fraunces,serif;color:#efe6d6}
.books .cover{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.books .cover .chs{justify-content:center}
.hint{color:var(--dim);font-size:.9rem;margin-top:16px;text-align:center}
.pgno{position:absolute;z-index:3;left:24px;bottom:calc(40px + env(safe-area-inset-bottom));font-size:.8rem;color:var(--dim)}
.nostimer #auto,.nostimer #adur,.nostimer #sbtn,.nostimer #sname{display:none}
.cvp{position:absolute;z-index:1;top:calc(128px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(44vw,20dvh);aspect-ratio:2/3;border-radius:14px;background:linear-gradient(160deg,#8a5a2b,#3b2a18);display:grid;place-items:center;font-size:3rem;box-shadow:0 18px 40px rgba(0,0,0,.55);cursor:pointer}
.books .cvp{position:static;transform:none;width:min(34vw,15dvh);margin:0 auto 14px}
.rdbtn{display:block;margin-top:14px;padding:11px 22px;border-radius:99px;background:#fff;color:var(--ink);font-weight:700}
.reader{position:absolute;inset:0;z-index:15;background:#f4ecd8;color:#2a2118;display:flex;flex-direction:column}
.rh{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid rgba(0,0,0,.1)}
.rh .rb{background:rgba(0,0,0,.08);width:44px;height:44px;flex:none;font-size:1.4rem;color:#2a2118}
.rt{min-width:0;text-align:left}.rt b{display:block;font-family:Fraunces,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt small{color:#6b5a45}
.pages{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}.pages::-webkit-scrollbar{display:none}
.pg{flex:none;width:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:16px 24px calc(34px + env(safe-area-inset-bottom));overflow-y:auto;font:1.08rem/1.62 Georgia,Fraunces,serif}
.pg p{margin:0 0 .9em}
.rl{position:absolute;inset:48px 0 0;display:grid;place-content:center;gap:14px;padding:30px;text-align:center;background:#f4ecd8;color:#2a2118}
.rl button{padding:10px 20px;border-radius:99px;background:#2a2118;color:#f4ecd8;font-weight:700}
#rfr{width:44px;height:44px;flex:none}
.spin svg{animation:spin .7s}@keyframes spin{to{transform:rotate(360deg)}}
.rst{display:block;margin:12px auto 0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;font-size:.82rem}
</style>
</head>

qi.oninput=()=>{const q=qi.value.trim();$("#qx").hidden=!qi.value;if(S.tab==="books")return;clearTimeout(st);if(q.length<2){qid++;$("#sug").hidden=true;return}st=setTimeout(()=>suggest(q),250)};
$("#sf").onsubmit=e=>{e.preventDefault();const q=qi.value.trim();if(q.length>1){if(S.tab==="books"){S.bq=q;qi.blur();setTab("books")}else runSearch(q)}};
$("#sug").onclick=e=>{const b=e.target.closest("button");if(b){qi.value=b.dataset.q;$("#qx").hidden=false;runSearch(b.dataset.q,b.dataset.q)}};
$("#qx").onclick=()=>{qi.value="";$("#qx").hidden=true;$("#sug").hidden=true;qid++;if(S.tab==="search")setTab("all");if(S.tab==="books"&&S.bq){S.bq="";setTab("books")}qi.focus()};
qi.addEventListener("keydown",e=>{if(e.key==="Escape")$("#sug").hidden=true});
document.addEventListener("click",e=>{if(!e.target.closest(".sw"))$("#sug").hidden=true});
/* ---------- auto-scroll with a visible timer ---------- */
const AUTO={...load("is_auto",{dur:8}),on:false},DURS=[5,8,12,20];
let left=AUTO.dur,lastIdx=-1,lastT=performance.now();
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmt=x=>Math.floor(x/60)+":"+pad(Math.floor(x%60));
function autoUI(){const m=S.tab==="music";$("#auto").setAttribute("aria-pressed",AUTO.on);$("#ac").style.fontSize=m?".74rem":"";
if(m){const d=au.duration,t=au.currentTime||0,ok=isFinite(d)&&d>0&&!!au.src&&!au.src.startsWith("data:"),p=ok?Math.min(1,t/d):0;
$("#adur").textContent=ok?fmt(d):"-:--";$("#ac").textContent=ok?fmt(t):"▶";$("#prg").style.strokeDashoffset=119.4*(1-p);$("#pb").style.width=p*100+"%";return}
const f=AUTO.on?left/AUTO.dur:1;$("#adur").textContent=AUTO.dur+"s";$("#ac").textContent=AUTO.on?Math.max(1,Math.ceil(left)):"▶";
$("#prg").style.strokeDashoffset=AUTO.on?119.4*f:119.4;$("#pb").style.width=AUTO.on?(1-f)*100+"%":"0"}
setInterval(()=>{const now=performance.now(),dt=(now-lastT)/1000;lastT=now;
if(AUTO.on&&S.tab!=="music"&&$("#rd").hidden&&!document.hidden&&document.activeElement?.tagName!=="INPUT"){
const ch=Math.max(1,feed.clientHeight),idx=Math.round(feed.scrollTop/ch);
if(idx!==lastIdx){lastIdx=idx;left=AUTO.dur}
else{left-=dt;if(left<=0){const nxt=feed.querySelectorAll(".card")[idx+1];
if(nxt&&!nxt.classList.contains("ld")){feed.scrollTo({top:(idx+1)*ch,behavior:calm?"auto":"smooth"});left=AUTO.dur}
else{left=0;if(S.done){AUTO.on=false;toast("Auto-scroll stopped: end of feed")}}}}}
autoUI()},100);
$("#auto").onclick=()=>{AUTO.on=!AUTO.on;left=AUTO.dur;lastIdx=-1;autoUI();toast(AUTO.on?(S.tab==="music"?"Auto-scroll on · next song when this one ends":"Auto-scroll on · "+AUTO.dur+"s per fact"):"Auto-scroll off")};
$("#adur").onclick=()=>{if(S.tab==="music")return;AUTO.dur=DURS[(DURS.indexOf(AUTO.dur)+1)%DURS.length];left=AUTO.dur;store("is_auto",{dur:AUTO.dur});autoUI()};
["touchstart","wheel","keydown"].forEach(ev=>feed.addEventListener(ev,()=>{left=AUTO.dur},{passive:true}));
autoUI();
/* ---------- menu: advertising contact ---------- */
const WA_NUMBER="254706898654"; /* WhatsApp number in international format, no + or leading 0 */
const mp=$("#mpop"),ib=$("#ibtn"),cb=$("#contact");
const WA_TEXT="Hi, I’d like to advertise on InfoScroll.";
cb.href="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(WA_TEXT);cb.target="_blank";cb.rel="noopener";
/* Android Chrome: open the WhatsApp app directly, falling back to the wa.me page */
cb.onclick=()=>{const ua=navigator.userAgent;if(/Android/.test(ua)&&/Chrome\//.test(ua)&&!/; wv\)/.test(ua)){location.href="intent://send/?phone="+WA_NUMBER+"&text="+encodeURIComponent(WA_TEXT)+"#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url="+encodeURIComponent(cb.href)+";end";return false}};
const menu=o=>{mp.hidden=!o;ib.setAttribute("aria-expanded",o)};
ib.onclick=()=>{menu(mp.hidden);$("#sug").hidden=true};
document.addEventListener("click",e=>{if(!e.target.closest(".menu"))menu(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")menu(false)});
$("#rfr").onclick=()=>{const b=$("#rfr");b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");setTab(S.tab);toast("Fresh facts loaded")};
$("#rst").onclick=()=>{Object.keys(SEEN).forEach(k=>delete SEEN[k]);Object.keys(SESS).forEach(k=>delete SESS[k]);store("is_seen",SEEN);menu(false);setTab(S.tab);toast("Seen facts reset")};
$("#rx").onclick=closeBook;
$("#pgs").addEventListener("scroll",()=>{if(!RB||!RB.pages.length)return;const b=$("#pgs"),p=Math.min(RB.pages.length-1,Math.round(b.scrollLeft/Math.max(1,b.clientWidth)));if(p!==RB.page){RB.page=p;upd()}},{passive:true});
addEventListener("keydown",e=>{if($("#rd").hidden)return;const b=$("#pgs");if(e.key==="ArrowRight")b.scrollBy({left:b.clientWidth,behavior:"smooth"});else if(e.key==="ArrowLeft")b.scrollBy({left:-b.clientWidth,behavior:"smooth"});else if(e.key==="Escape")closeBook()});
const SHARE_URL=""; /* optional: paste your public link here; otherwise this page’s own address is shared */
$("#shr").onclick=async()=>{menu(false);const url=SHARE_URL||location.href.split("#")[0],text="InfoScroll: scroll through facts, football and music.";
if(!/^https?:/.test(url))return toast("Put the app online first, then share its link");
if(navigator.share){try{await navigator.share({title:"InfoScroll",text,url})}catch(e){}return}
try{await navigator.clipboard.writeText(url);toast("Link copied. Paste it in WhatsApp")}catch(e){window.open("https://wa.me/?text="+encodeURIComponent(text+" "+url),"_blank")}};
$("#ofl").onclick=()=>{menu(false);setTab(S.tab==="offline"?"all":"offline")};
addEventListener("offline",()=>toast("You’re offline. Open the menu and tap Offline view"));
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
const offStart=!navigator.onLine&&SAVED.length;
setTab(offStart?"offline":"all");if(offStart)toast("Offline. Showing facts saved on your phone");
</script>
